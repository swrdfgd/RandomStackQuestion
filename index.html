<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Random StackExchange Question</title>
  <style>
    :root {
      --bg: #0f1218;
      --panel: #161b26;
      --accent: #8fd3f4;
      --text: #e6e9f0;
      --muted: #9aa4bf;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1c2333, var(--bg));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 520px;
      max-width: 90%;
      background: var(--panel);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: .4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 22px;
    }

    button {
      background: linear-gradient(135deg, #7f9cf5, #4fd1c5);
      border: none;
      color: #0b1020;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
    }

    .loader {
      margin-top: 14px;
      width: 100%;
      height: 6px;
      background: #232a3d;
      border-radius: 10px;
      overflow: hidden;
      display: none;
    }

    .loader.active::before {
      content: "";
      display: block;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: loading 1.2s infinite;
    }

    @keyframes loading {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }

    .result {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #232a3d;
      display: none;
    }

    .site {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Random StackExchange Question</h1>
    <div class="subtitle">Random Question from the Stack Exchange Multiverse</div>

    <button id="generateBtn">Generate Random Question</button>

    <div class="status" id="statusText">Idle</div>
    <div class="loader" id="loader"></div>

    <div class="result" id="result">
      <div class="site" id="siteName"></div>
      <a id="questionLink" href="#" target="_blank"></a>
    </div>
  </div>

<script>

const btn = document.getElementById("generateBtn");
const statusText = document.getElementById("statusText");
const loader = document.getElementById("loader");
const result = document.getElementById("result");
const siteNameEl = document.getElementById("siteName");
const questionLink = document.getElementById("questionLink");

function setLoading(isLoading, text) {
  loader.classList.toggle("active", isLoading);
  loader.style.display = isLoading ? "block" : "none";
  btn.disabled = isLoading;
  statusText.textContent = text || "";
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("Network error");
  return res.json();
}

async function getRandomQuestion() {
  setLoading(true, "Fetching Stack Exchange sites...");
  result.style.display = "none";

  // 1. Ambil semua site
  const sitesData = await fetchJSON(
    "https://api.stackexchange.com/2.3/sites?pagesize=500"
  );

  const sites = sitesData.items;
  const site = sites[Math.floor(Math.random() * sites.length)];
  const siteApi = site.api_site_parameter;

  setLoading(true, `Selected site: ${site.name}`);

  // 2. Ambil newest question → max ID
  const newestData = await fetchJSON(
    `https://api.stackexchange.com/2.3/questions?order=desc&sort=creation&site=${siteApi}&pagesize=1`
  );

  if (!newestData.items.length) {
    throw new Error("No questions on this site");
  }

  const maxId = newestData.items[0].question_id;

  setLoading(true, `Searching...`);

  // 3. Loop random ID sampai ketemu
  while (true) {
    const randomId = Math.floor(Math.random() * maxId) + 1;

    const qData = await fetchJSON(
      `https://api.stackexchange.com/2.3/questions/${randomId}?site=${siteApi}`
    );

    if (qData.items && qData.items.length) {
      const q = qData.items[0];

      // 4. Tampilkan
      siteNameEl.textContent = site.name;
      questionLink.textContent = q.title;
      questionLink.href = q.link;

      result.style.display = "block";
      setLoading(false, "Done");
      return;
    }
  }
}

btn.addEventListener("click", () => {
  getRandomQuestion().catch(err => {
    setLoading(false, "Error occurred. Try again.");
    console.error(err);
  });
});
</script>

</body>
</html>
